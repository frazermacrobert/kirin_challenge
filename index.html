<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Walk — Kirin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js" defer></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <!-- Neon background -->
  <div class="bg"></div>
  <!-- NEW: soft glow that follows the progress knob -->
  <div class="bg-follow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo"><span>🦄</span></div>
      <h1>Memory Walk</h1>
    </div>
    <aside class="hud" aria-live="polite">
      <div class="row"><span class="k">Group progress</span><span id="kmStat" class="v">0 / 0 km</span></div>
      <div class="row"><span class="k">Current year</span><span id="yearStat" class="v">—</span></div>
      <div class="row"><span class="k">Walkers</span><span id="walkersStat" class="v">10</span></div>
    </aside>
  </header>

  <main>
    <div id="canvas-holder" aria-label="Timeline canvas">
      <!-- NEW: ambient neon overlay that gently pulses during idle -->
      <div id="ambientBar" class="progress-ambient" aria-hidden="true"></div>
    </div>

    <!-- Focus card (only on hover) -->
    <div id="focusCard" class="focus hidden" role="dialog" aria-modal="false">
      <div class="focus-head">
        <span id="focusYear" class="focus-year">—</span>
        <span id="focusTitle" class="focus-title">—</span>
      </div>
      <div class="focus-media" id="focusMedia" aria-hidden="true"></div>
      <div class="focus-caption" id="focusCaption">—</div>
      <div class="focus-meter"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  </main>

  <!-- Bottom toolbar (manual controls only) -->
  <form id="toolbar" class="toolbar" autocomplete="off">
    <div class="keys">
      <span class="pill">←</span>
      <span>1 − to step</span>
      <span class="pill">→</span>
    </div>

    <div class="sim">
      <div class="nudge">
        <button type="button" id="decBtn" aria-label="Minus one kilometer">−</button>
        <button type="button" id="incBtn" aria-label="Plus one kilometer">+</button>
      </div>
      <input id="kmSlider" type="range" min="0" step="1" aria-label="Scrub progress along the timeline" />
    </div>

    <div class="add">
      <label for="addInput">Add km</label>
      <input id="addInput" type="number" step="1" inputmode="numeric" placeholder="+10 or -3" />
      <button type="submit" class="primary">Submit</button>
      <button type="button" id="resetBtn" class="ghost">Reset</button>
    </div>
  </form>
</body>
</html>
