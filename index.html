<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Memory Walk — Kirin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/kirin_badge.svg" alt="Kirin badge" class="badge">
      <div class="title-wrap">
        <h1 class="title">Memory Walk</h1>
        <div class="team">— Kirin</div>
      </div>
    </div>
    <div class="stats" id="stats">
      <div class="stat-line" id="stat-progress">438 / 1955 km</div>
      <div class="stat-line" id="stat-year">Current year 508 CE</div>
      <div class="stat-line" id="stat-walkers">Walkers 10</div>
    </div>
  </header>

  <div id="canvas-container"></div>

  <div class="controls">
    <button id="minus" class="ctrl">−</button>
    <input id="progressRange" type="range" min="0" max="1955" value="438" />
    <button id="plus" class="ctrl">+</button>
    <span class="hint">← / → to step 1 km</span>
  </div>

  <div id="popover" class="popover hidden">
    <div class="popover-title" id="popTitle">Year — Title</div>
    <div class="popover-body" id="popBody">Short caption or memory text</div>
    <button id="restoreBtn" class="restore">Restore</button>
  </div>

  <div id="debug" class="debug">progressKm: 438 | mappedYear: 508 | pixelBlockSize: 8px</div>

  <script src="sketch.js"></script>
</body>
</html>
